# Surfmi 内置模板：Surge 语法示例
# 订阅只提供节点；policy-regex-filter 从订阅节点中按名称筛选。
# Built-in example in Surge syntax: policy-regex-filter picks subscription proxies by name.
[Proxy Group]
节点选择 = select, 自动选择, 香港, 日本, 美国, DIRECT, include-all-proxies=true
自动选择 = url-test, policy-regex-filter=^(?!.*(剩余|到期|流量|官网|套餐)).*$, url=http://www.gstatic.com/generate_204, interval=300, tolerance=50
香港 = url-test, policy-regex-filter=(?i)港|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z])|Hong\s?Kong, interval=300
日本 = url-test, policy-regex-filter=(?i)日本|东京|大阪|🇯🇵|(?<![A-Za-z])JP(?![A-Za-z])|Japan, interval=300
美国 = url-test, policy-regex-filter=(?i)美国|美國|🇺🇸|(?<![A-Za-z])US(?![A-Za-z])|United\s?States, interval=300
AI = select, 美国, 日本, 节点选择

[Rule]
RULE-SET,LAN,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/ai.conf,AI
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/OpenAI/OpenAI.list,AI
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Telegram/Telegram.list,节点选择
RULE-SET,https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.mrs,节点选择
RULE-SET,https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs,DIRECT
RULE-SET,https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs,DIRECT
FINAL,节点选择
