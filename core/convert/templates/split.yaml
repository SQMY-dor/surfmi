# Surfmi 内置模板：分流
# 地区分组按节点名称正则自动归类；没有匹配节点的分组会被自动跳过。
# Built-in template "Split": region groups are filled by name regex; empty groups are skipped.
proxy-groups:
  - name: 节点选择
    type: select
    proxies: [自动选择, 香港, 台湾, 日本, 新加坡, 美国, DIRECT]
    include-all: true
    exclude-filter: '(?i)剩余|到期|流量|官网|套餐|重置|过期|expire|traffic|reset'
  - name: 自动选择
    type: url-test
    include-all: true
    exclude-filter: '(?i)剩余|到期|流量|官网|套餐|重置|过期|expire|traffic|reset'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: AI
    type: select
    proxies: [美国, 日本, 新加坡, 台湾, 节点选择]
  - name: 流媒体
    type: select
    proxies: [节点选择, 香港, 台湾, 日本, 新加坡, 美国]
  - name: Telegram
    type: select
    proxies: [节点选择, 香港, 台湾, 日本, 新加坡, 美国]
  - name: 谷歌
    type: select
    proxies: [节点选择, 香港, 台湾, 日本, 新加坡, 美国, DIRECT]
  - name: 苹果
    type: select
    proxies: [DIRECT, 节点选择, 香港, 台湾, 日本, 新加坡, 美国]
  - name: 微软
    type: select
    proxies: [DIRECT, 节点选择, 香港, 台湾, 日本, 新加坡, 美国]
  - name: 广告拦截
    type: select
    proxies: [REJECT, DIRECT]
  - name: 漏网之鱼
    type: select
    proxies: [节点选择, DIRECT, 香港, 台湾, 日本, 新加坡, 美国]
  - name: 香港
    type: url-test
    include-all: true
    filter: '(?i)港|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z])|Hong\s?Kong|HKG'
    exclude-filter: '(?i)剩余|到期|流量|官网|套餐|重置|过期|expire|traffic|reset'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 台湾
    type: url-test
    include-all: true
    filter: '(?i)台湾|台灣|台北|新北|彰化|🇹🇼|(?<![A-Za-z])TW(?![A-Za-z])|Taiwan|Taipei'
    exclude-filter: '(?i)剩余|到期|流量|官网|套餐|重置|过期|expire|traffic|reset'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 日本
    type: url-test
    include-all: true
    filter: '(?i)日本|东京|東京|大阪|埼玉|🇯🇵|(?<![A-Za-z])JP(?![A-Za-z])|Japan|Tokyo|Osaka'
    exclude-filter: '(?i)剩余|到期|流量|官网|套餐|重置|过期|expire|traffic|reset'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 新加坡
    type: url-test
    include-all: true
    filter: '(?i)新加坡|狮城|獅城|🇸🇬|(?<![A-Za-z])SG(?![A-Za-z])|Singapore'
    exclude-filter: '(?i)剩余|到期|流量|官网|套餐|重置|过期|expire|traffic|reset'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 美国
    type: url-test
    include-all: true
    filter: '(?i)美国|美國|洛杉矶|硅谷|西雅图|纽约|芝加哥|🇺🇸|(?<![A-Za-z])US(?![A-Za-z])|USA|United\s?States|America|Los\s?Angeles|San\s?Jose|Seattle'
    exclude-filter: '(?i)剩余|到期|流量|官网|套餐|重置|过期|expire|traffic|reset'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

