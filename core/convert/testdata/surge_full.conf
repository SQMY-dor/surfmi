#!MANAGED-CONFIG https://example.com/surge.conf interval=43200 strict=false
# Sample Surge profile used by unit tests. All servers/credentials are fake.

[General]
loglevel = notify
ipv6 = false
dns-server = system, 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://dns.alidns.com/dns-query
always-real-ip = *.srv.nintendo.net, *.stun.playstation.net
proxy-test-url = http://cp.cloudflare.com/generate_204
skip-proxy = 127.0.0.1, 192.168.0.0/16, localhost
tun-excluded-routes = 192.168.0.0/16

[Proxy]
On = direct
Block = reject
HK-SS = ss, hk.example.com, 8388, encrypt-method=aes-256-gcm, password=pass1, udp-relay=true, tfo=true
HK-SS-Obfs = ss, hk2.example.com, 8389, encrypt-method=chacha20-ietf-poly1305, password=pass2, obfs=http, obfs-host=bing.com
JP-VMess = vmess, jp.example.com, 443, username=0a1b2c3d-0000-4000-8000-123456789abc, ws=true, ws-path=/ws, ws-headers="Host:jp.example.com|User-Agent:Mozilla", tls=true, sni=jp.example.com, vmess-aead=true
US-Trojan = trojan, us.example.com, 443, password=trojanpass, sni=us.example.com, skip-cert-verify=true
SG-Snell = snell, sg.example.com, 6160, psk=snellpsk, version=4, obfs=tls, obfs-host=www.bing.com, reuse=true
TW-HTTP = https, tw.example.com, 443, user1, pass1
KR-SOCKS = socks5, kr.example.com, 1080, username=u, password=p, udp-relay=true
DE-TUIC = tuic-v5, de.example.com, 443, password=tuicpass, uuid=0a1b2c3d-0000-4000-8000-123456789abd, alpn=h3, sni=de.example.com
FR-Hy2 = hysteria2, fr.example.com, 443, password=hy2pass, download-bandwidth=200, sni=fr.example.com, salamander-password=obfspw
NL-WG = wireguard, section-name = NL, underlying-proxy = HK-SS
UK-AnyTLS = anytls, uk.example.com, 443, password=anypass, sni=uk.example.com
Ext = external, exec = "/usr/local/bin/sslocal", local-port = 1080

[Proxy Group]
Proxy = select, Auto, HK, Fallback, LB, DIRECT, include-other-group="Streaming", hidden=false
Auto = url-test, HK-SS, JP-VMess, US-Trojan, SG-Snell, url=http://www.gstatic.com/generate_204, interval=600, tolerance=50, timeout=5
HK = select, HK-SS, HK-SS-Obfs, policy-regex-filter=HK
Fallback = fallback, US-Trojan, DE-TUIC, FR-Hy2, interval=300
LB = load-balance, HK-SS, JP-VMess, persistent=true
Streaming = select, include-all-proxies=true, policy-regex-filter=(JP|US)
Home = subnet, default = Proxy, "SSID:MyHome" = DIRECT, "TYPE:CELLULAR" = Proxy
Remote = select, policy-path=https://sub.example.com/list.txt, policy-regex-filter=^R-, update-interval=3600

[Rule]
DOMAIN,ads.example.com,REJECT-TINYGIF
DOMAIN-SUFFIX,google.com,Proxy
DOMAIN-KEYWORD,youtube,Streaming
DOMAIN-WILDCARD,*.example.org,DIRECT
IP-CIDR,1.1.1.1/32,Proxy,no-resolve
IP-CIDR6,2001:db8::/32,Proxy
GEOIP,US,Proxy
IP-ASN,13335,Proxy,no-resolve
PROCESS-NAME,com.android.chrome,Proxy
DEST-PORT,22,DIRECT
SRC-IP,192.168.1.10,DIRECT
DST-PORT,>=10000,Proxy
PROTOCOL,UDP,Proxy
AND,((DOMAIN-SUFFIX,apple.com),(DEST-PORT,443)),DIRECT
OR,((DOMAIN,a.com),(DOMAIN,b.com)),Proxy
NOT,((DOMAIN-SUFFIX,cn)),Proxy
USER-AGENT,Instagram*,Proxy
URL-REGEX,^https?://ad\.,REJECT
RULE-SET,https://rules.example.com/Telegram.list,Proxy
DOMAIN-SET,https://rules.example.com/reject-domains.txt,REJECT
RULE-SET,LAN,DIRECT
RULE-SET,SYSTEM,DIRECT
GEOIP,CN,DIRECT
FINAL,Proxy,dns-failed
DOMAIN,after-final.example.com,DIRECT

[Host]
router.lan = 192.168.1.1
*.corp.example.com = server:10.0.0.53
example.local = server:system

[WireGuard NL]
private-key = AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
self-ip = 10.8.0.2
self-ip-v6 = fd00::2
dns-server = 1.1.1.1
mtu = 1280
peer = (public-key = AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=, allowed-ips = "0.0.0.0/0, ::/0", endpoint = nl.example.com:51820, keepalive = 25, client-id = 1/2/3)

[URL Rewrite]
^https?://(www.)?google.cn https://www.google.com 302

[MITM]
hostname = *.example.com

[Script]
test = type=http-response,pattern=^https://example.com,script-path=test.js
