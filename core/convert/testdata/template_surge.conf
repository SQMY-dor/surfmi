[General]
loglevel = notify

[Proxy Group]
Proxy = select, HK, JP, DIRECT, include-all-proxies=true
HK = url-test, policy-regex-filter=(?i)港|HK, interval=300
JP = fallback, policy-regex-filter=日本
SG = url-test, policy-regex-filter=新加坡

[Rule]
DOMAIN-SUFFIX,google.com,Proxy
RULE-SET,https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs,DIRECT
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject.conf,REJECT
DOMAIN-SUFFIX,sg-only.example,SG
GEOSITE,cn,DIRECT
FINAL,Proxy
